name: Deploy broker AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-broker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check required repository variables
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          VPN_SERVER_CERTIFICATE_ARN: ${{ vars.VPN_SERVER_CERTIFICATE_ARN }}
          VPN_CLIENT_ROOT_CERTIFICATE_ARN: ${{ vars.VPN_CLIENT_ROOT_CERTIFICATE_ARN }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME"
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"
          test -n "$VPN_SERVER_CERTIFICATE_ARN"
          test -n "$VPN_CLIENT_ROOT_CERTIFICATE_ARN"

      - name: Terraform init
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=broker/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_vpn_server_certificate_arn: ${{ vars.VPN_SERVER_CERTIFICATE_ARN }}
          TF_VAR_vpn_client_root_certificate_arn: ${{ vars.VPN_CLIENT_ROOT_CERTIFICATE_ARN }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Publish connection outputs
        run: |
          echo "MSK bootstrap: $(terraform output -raw bootstrap_brokers_sasl_scram_tls)"
          echo "Client VPN endpoint: $(terraform output -raw client_vpn_endpoint_id)"
          echo "SCRAM secret ARN: $(terraform output -raw scram_secret_arn)"