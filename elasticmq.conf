include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

aws {
  region = us-west-2
  accountId = 000000000000
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}